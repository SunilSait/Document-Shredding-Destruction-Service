<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | VaultShred — Document Shredding & Destruction</title>
    <meta name="description" content="The page you're looking for doesn't exist or has been permanently shredded. Return to the VaultShred home page.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=8.0">
    <script>
        (function() {
            try {
                if (localStorage.getItem('vs-dark') === '1') {
                    document.documentElement.classList.add('dark');
                } else if (localStorage.getItem('vs-dark') === '0') {
                    document.documentElement.classList.remove('dark');
                }
                if (localStorage.getItem('vs-rtl') === '1') {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<header class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="VaultShred Home">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1D3557"/><stop offset="100%" stop-color="#2E5173"/></linearGradient></defs>
            <rect width="100" height="100" rx="20" fill="url(#logoBg)"/>
            <rect x="28" y="22" width="44" height="56" rx="4" fill="none" stroke="#E63946" stroke-width="5"/>
            <path d="M36 38 L64 38 M36 48 L64 48 M36 58 L52 58" stroke="white" stroke-width="4" stroke-linecap="round"/>
            <path d="M52 68 L72 48" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span class="nav-logo-text">
            <span class="brand-top">Secure Shredding</span>
            <span class="brand-bottom">VaultShred</span>
        </span>
    </a>
    <div style="display:flex;gap:0.5rem;align-items:center;">
        <button onclick="toggleDir()" class="auth-toggle-btn" id="rtlToggleNav" aria-label="Toggle layout direction / RTL" title="Toggle Direction">
            <span class="dir-indicator dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" id="darkToggleNav" aria-label="Toggle dark mode" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>
</header>

<!-- Content -->
<main class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;text-align:center;">
        <!-- Illustration with spinning background -->
        <div class="error-illustration">
            <svg class="error-spin-bg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="80" cy="80" r="72" stroke="var(--secondary)" stroke-width="3" stroke-dasharray="14 8" opacity="0.4"/>
                <circle cx="80" cy="80" r="54" stroke="var(--primary)" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.3"/>
                <circle cx="80" cy="80" r="36" stroke="var(--secondary)" stroke-width="2" stroke-dasharray="6 4" opacity="0.2"/>
            </svg>
            <div class="error-code">404</div>
        </div>

        <div class="error-subtitle">Page Not Found</div>
        <p class="error-desc">The page you're looking for seems to have been securely shredded or moved! Don't worry — all your client data and destruction records remain safe.</p>

        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.25rem;">
            <a href="index.html" class="btn btn-primary btn-lg"><i class="fas fa-home"></i> Back to Home</a>
            <a href="contact.html" class="btn btn-secondary btn-lg"><i class="fas fa-headset"></i> Contact Support</a>
        </div>

        <div class="error-quick-links">
            <span>Popular pages:</span>
            <a href="services.html">Services</a>
            <span>•</span>
            <a href="pricing.html">Pricing Plans</a>
            <span>•</span>
            <a href="compliance.html">Compliance</a>
            <span>•</span>
            <a href="login.html">Client Portal</a>
        </div>
    </div>
</main>

<script src="components.js"></script>
</body>
</html>
