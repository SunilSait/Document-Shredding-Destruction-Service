<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — VaultShred Client Portal</title>
    <meta name="description" content="Sign in to your VaultShred client portal to schedule pickups, track destruction certificates, and manage your shredding service plan.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div id="auth-topbar-placeholder"></div>

<main class="auth-main">
    <div class="auth-card">
        <!-- Decorative Orb -->
        <div class="auth-card-orb"></div>

        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="VaultShred Home">
            <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1D3557"/><stop offset="100%" stop-color="#2E5173"/></linearGradient></defs>
                <rect width="100" height="100" rx="20" fill="url(#logoBg)"/>
                <rect x="28" y="22" width="44" height="56" rx="4" fill="none" stroke="#E63946" stroke-width="5"/>
                <path d="M36 38 L64 38 M36 48 L64 48 M36 58 L52 58" stroke="white" stroke-width="4" stroke-linecap="round"/>
                <path d="M52 68 L72 48" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
            </svg>
            <span class="nav-logo-text">
                <span class="brand-top">Secure Shredding</span>
                <span class="brand-bottom">VaultShred</span>
            </span>
        </a>

        <!-- Header -->
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Sign in to access your client portal & destruction records</p>
        </div>

        <!-- Social Login -->
        <div class="social-login-grid">
            <button type="button" class="social-btn" aria-label="Sign in with Google" title="Sign in with Google">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.9 33.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.2-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.5 18.8 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.8-3.5-11.3-8.3l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.2-2.7-.4-3.9z"/></svg>
            </button>
            <button type="button" class="social-btn" aria-label="Sign in with Apple" title="Sign in with Apple">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.96 4.41-3.74 4.25z"/></svg>
            </button>
            <button type="button" class="social-btn" aria-label="Sign in with Facebook" title="Sign in with Facebook">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.02 10.13 11.93v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8v8.44C19.61 23.09 24 18.09 24 12.07z"/></svg>
            </button>
        </div>

        <div class="divider">or sign in with email</div>

        <!-- Form -->
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-control" placeholder="you@company.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="login-password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div class="auth-options">
                <label class="remember-me" for="rememberMe">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="link-primary" onclick="event.preventDefault(); alert('Password reset link sent to your email.');">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full">Sign In <i class="fas fa-arrow-right"></i></button>
        </form>

        <div class="auth-switch">
            Don't have an account? <a href="signup.html" class="link-primary">Create Account</a>
        </div>

        <div class="auth-security-badge">
            <i class="fas fa-shield-halved"></i>
            <span>256-Bit SSL Encrypted • NAID AAA Audit Ready</span>
        </div>
    </div>
</main>

<script src="components.js"></script>
</body>
</html>
